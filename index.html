<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel — Movie & TV Tracker</title>
  <style>
    :root {
      --bg: #0d0f14;
      --bg-elev: #161a23;
      --bg-elev-2: #1e2330;
      --border: #2a3040;
      --text: #e7eaf0;
      --text-dim: #9aa3b5;
      --text-faint: #6b7488;
      --accent: #f5b942;
      --accent-dim: #c79530;
      --watched: #4ade80;
      --want: #60a5fa;
      --watching: #c084fc;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 70% -10%, #1a1f2c 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    a { color: var(--accent); }

    .container { max-width: 980px; margin: 0 auto; padding: 0 18px; }

    /* ---------- Header ---------- */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(13, 15, 20, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      max-width: 980px;
      margin: 0 auto;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand .logo {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #ff8a5b);
      display: grid; place-items: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(245, 185, 66, 0.35);
    }
    .brand h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; }
    .brand .sub { font-size: 12px; color: var(--text-faint); font-weight: 500; }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .nav-toggle {
      display: flex;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }
    .nav-toggle button {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s, color 0.15s;
    }
    .nav-toggle button.active { background: var(--bg-elev-2); color: var(--text); }

    .btn {
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s, background 0.15s, border-color 0.15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #1a1205;
      padding: 9px 16px;
      box-shadow: 0 4px 14px rgba(245, 185, 66, 0.28);
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost {
      background: var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 16px;
    }
    .btn-ghost:hover { background: var(--bg-elev-2); }
    .btn-danger {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.35);
      padding: 9px 16px;
    }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.2); }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin: 22px 0 18px;
    }
    .tabs { display: flex; gap: 7px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab:hover { border-color: #3a4255; color: var(--text); }
    .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tab .count {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .tab.active .count { background: rgba(0, 0, 0, 0.15); }

    .sort-wrap { display: flex; align-items: center; gap: 8px; }
    .sort-wrap label { font-size: 12px; color: var(--text-faint); font-weight: 600; }
    select.sort {
      background: var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
    }

    /* ---------- List / cards ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--border);
    }
    .card.s-watched::before { background: var(--watched); }
    .card.s-want_to_watch::before { background: var(--want); }
    .card.s-currently_watching::before { background: var(--watching); }
    .card:hover { border-color: #3a4255; transform: translateY(-2px); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .card-meta { font-size: 12.5px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .card-meta .dot::before { content: "•"; margin-right: 6px; color: var(--text-faint); }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .badge-watched { background: rgba(74, 222, 128, 0.14); color: var(--watched); }
    .badge-want_to_watch { background: rgba(96, 165, 250, 0.14); color: var(--want); }
    .badge-currently_watching { background: rgba(192, 132, 252, 0.14); color: var(--watching); }
    .badge-type {
      background: var(--bg-elev-2);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .rating-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
    }
    .card-notes {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.45;
      border-top: 1px solid var(--border);
      padding-top: 9px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .icon-btn {
      flex: 1;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text); border-color: #3a4255; }
    .icon-btn.del:hover { color: var(--danger); border-color: rgba(248, 113, 113, 0.4); }

    /* ---------- Empty / loading ---------- */
    .empty, .loading {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-faint);
    }
    .empty .big { font-size: 46px; margin-bottom: 12px; }
    .empty h3 { color: var(--text-dim); font-size: 17px; margin-bottom: 6px; }
    .empty p { font-size: 14px; }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Stats ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .stat-card .num { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
    .stat-card .lbl { font-size: 12.5px; color: var(--text-dim); font-weight: 600; margin-top: 3px; }
    .stat-card .num.accent { color: var(--accent); }

    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    .panel h3 { font-size: 15px; margin-bottom: 16px; font-weight: 700; }

    .bar-row { margin-bottom: 13px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .bar-label .name { color: var(--text); font-weight: 600; }
    .bar-label .val { color: var(--text-dim); }
    .bar-track { background: var(--bg-elev-2); border-radius: 999px; height: 9px; overflow: hidden; }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #ff8a5b);
      transition: width 0.5s ease;
    }
    .split-row { display: flex; gap: 14px; }
    .split-item { flex: 1; text-align: center; padding: 14px; background: var(--bg-elev-2); border-radius: var(--radius-sm); }
    .split-item .n { font-size: 24px; font-weight: 800; }
    .split-item .l { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

    /* ---------- Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 30px 16px;
      overflow-y: auto;
      z-index: 50;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 520px;
      padding: 24px;
      animation: pop 0.18s ease;
    }
    @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-head h2 { font-size: 19px; font-weight: 700; }
    .close-x {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 32px; height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .close-x:hover { color: var(--text); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
    .field label .req { color: var(--accent); }
    .field input, .field select, .field textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      width: 100%;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 185, 66, 0.12);
    }
    .field textarea { resize: vertical; min-height: 64px; }
    .field .hint { font-size: 11px; color: var(--text-faint); }
    .form-error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--danger);
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .form-error.show { display: block; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 60;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { border-color: rgba(248, 113, 113, 0.45); color: var(--danger); }

    .hidden { display: none !important; }

    /* ---------- Mobile FAB ---------- */
    .fab {
      position: fixed;
      bottom: 22px; right: 22px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #1a1205;
      font-size: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(245, 185, 66, 0.4);
      display: none;
      z-index: 25;
    }

    @media (max-width: 600px) {
      .brand .sub { display: none; }
      .header-actions .btn-primary { display: none; }
      .fab { display: block; }
      .form-grid { grid-template-columns: 1fr; }
      .toolbar { gap: 12px; }
      .sort-wrap { width: 100%; justify-content: space-between; }
      select.sort { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo">&#127916;</div>
        <div>
          <h1>Reel</h1>
          <div class="sub">Your movie &amp; TV tracker</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="nav-toggle">
          <button id="nav-list" class="active" onclick="switchView('list')">List</button>
          <button id="nav-stats" onclick="switchView('stats')">Stats</button>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- LIST VIEW -->
    <section id="view-list">
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab active" data-status="all" onclick="setFilter('all')">All <span class="count" id="c-all">0</span></button>
          <button class="tab" data-status="watched" onclick="setFilter('watched')">Watched <span class="count" id="c-watched">0</span></button>
          <button class="tab" data-status="want_to_watch" onclick="setFilter('want_to_watch')">Want to Watch <span class="count" id="c-want_to_watch">0</span></button>
          <button class="tab" data-status="currently_watching" onclick="setFilter('currently_watching')">Currently Watching <span class="count" id="c-currently_watching">0</span></button>
        </div>
        <div class="sort-wrap">
          <label for="sort">Sort</label>
          <select class="sort" id="sort" onchange="setSort(this.value)">
            <option value="created_desc">Date Added (newest)</option>
            <option value="watch_desc">Watch Date (recent)</option>
            <option value="rating_desc">Rating (high&ndash;low)</option>
            <option value="year_desc">Release Year (new)</option>
            <option value="title_asc">Title (A&ndash;Z)</option>
          </select>
        </div>
      </div>
      <div id="list-area"></div>
    </section>

    <!-- STATS VIEW -->
    <section id="view-stats" class="hidden">
      <div id="stats-area"></div>
    </section>
  </main>

  <button class="fab" onclick="openAddModal()">+</button>

  <!-- ADD / EDIT MODAL -->
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">Add Entry</h2>
        <button class="close-x" onclick="closeModal()">&times;</button>
      </div>
      <div class="form-error" id="form-error"></div>
      <form id="entry-form" onsubmit="return false;">
        <input type="hidden" id="f-id" />
        <div class="form-grid">
          <div class="field full">
            <label for="f-title">Title <span class="req">*</span></label>
            <input type="text" id="f-title" placeholder="e.g. Blade Runner 2049" autocomplete="off" />
          </div>
          <div class="field">
            <label for="f-type">Type</label>
            <select id="f-type">
              <option value="movie">Movie</option>
              <option value="tv_show">TV Show</option>
            </select>
          </div>
          <div class="field">
            <label for="f-status">Status <span class="req">*</span></label>
            <select id="f-status" onchange="onStatusChange()">
              <option value="want_to_watch">Want to Watch</option>
              <option value="currently_watching">Currently Watching</option>
              <option value="watched">Watched</option>
            </select>
          </div>
          <div class="field">
            <label for="f-year">Release Year</label>
            <input type="number" id="f-year" placeholder="2024" min="1888" max="2100" />
          </div>
          <div class="field">
            <label for="f-genre">Genre</label>
            <input type="text" id="f-genre" placeholder="e.g. Sci-Fi" autocomplete="off" list="genre-list" />
            <datalist id="genre-list">
              <option>Action</option><option>Adventure</option><option>Animation</option>
              <option>Comedy</option><option>Crime</option><option>Documentary</option>
              <option>Drama</option><option>Fantasy</option><option>Horror</option>
              <option>Mystery</option><option>Romance</option><option>Sci-Fi</option>
              <option>Thriller</option><option>War</option><option>Western</option>
            </datalist>
          </div>
          <div class="field" id="wrap-watchdate">
            <label for="f-watchdate">Watch Date</label>
            <input type="date" id="f-watchdate" />
          </div>
          <div class="field" id="wrap-rating">
            <label for="f-rating">Rating (1&ndash;10)</label>
            <input type="number" id="f-rating" placeholder="8" min="1" max="10" />
          </div>
          <div class="field full">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" placeholder="Optional thoughts&hellip;"></textarea>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-btn" onclick="saveEntry()">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ---------- Config / state ----------
    const API = '/api/entries';
    const STATUS_LABELS = {
      watched: 'Watched',
      want_to_watch: 'Want to Watch',
      currently_watching: 'Currently Watching',
    };
    const TYPE_LABELS = { movie: 'Movie', tv_show: 'TV Show' };
    const LS_SORT = 'reel.sort';
    const LS_FILTER = 'reel.filter';

    let entries = [];
    let currentFilter = localStorage.getItem(LS_FILTER) || 'all';
    let currentSort = localStorage.getItem(LS_SORT) || 'created_desc';
    let currentView = 'list';

    // ---------- Utilities ----------
    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show' + (isErr ? ' err' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = ''; }, 2600);
    }
    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d + 'T00:00:00');
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // ---------- API calls ----------
    async function apiList() {
      const r = await fetch(API);
      if (!r.ok) throw new Error('Failed to load entries');
      const j = await r.json();
      return j.entries || [];
    }
    async function apiCreate(body) {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Create failed');
      return j.entry;
    }
    async function apiUpdate(id, body) {
      const r = await fetch(API + '/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Update failed');
      return j.entry;
    }
    async function apiDelete(id) {
      const r = await fetch(API + '/' + id, { method: 'DELETE' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Delete failed');
    }

    // ---------- Load + render ----------
    async function load() {
      const area = document.getElementById('list-area');
      area.innerHTML = '<div class="loading"><div class="spinner"></div>Loading your collection&hellip;</div>';
      try {
        entries = await apiList();
        render();
      } catch (e) {
        area.innerHTML = '<div class="empty"><div class="big">&#9888;&#65039;</div><h3>Couldn\'t load entries</h3><p>' + esc(e.message) + '</p></div>';
      }
    }

    function statusCounts() {
      const c = { all: entries.length, watched: 0, want_to_watch: 0, currently_watching: 0 };
      entries.forEach(e => { if (c[e.status] !== undefined) c[e.status]++; });
      return c;
    }

    function sortedFiltered() {
      let list = currentFilter === 'all' ? entries.slice() : entries.filter(e => e.status === currentFilter);
      const cmp = {
        created_desc: (a, b) => new Date(b.created_at) - new Date(a.created_at),
        watch_desc: (a, b) => (b.watch_date || '').localeCompare(a.watch_date || ''),
        rating_desc: (a, b) => (b.rating || 0) - (a.rating || 0),
        year_desc: (a, b) => (b.year || 0) - (a.year || 0),
        title_asc: (a, b) => (a.title || '').localeCompare(b.title || ''),
      }[currentSort];
      return list.sort(cmp);
    }

    function render() {
      const counts = statusCounts();
      Object.keys(counts).forEach(k => {
        const el = document.getElementById('c-' + k);
        if (el) el.textContent = counts[k];
      });

      const area = document.getElementById('list-area');
      const list = sortedFiltered();

      if (entries.length === 0) {
        area.innerHTML = '<div class="empty"><div class="big">&#127902;</div><h3>No entries yet</h3><p>Add your first movie or show to start tracking.</p></div>';
        return;
      }
      if (list.length === 0) {
        area.innerHTML = '<div class="empty"><div class="big">&#128269;</div><h3>Nothing here</h3><p>No entries match this filter.</p></div>';
        return;
      }

      area.innerHTML = '<div class="grid">' + list.map(cardHtml).join('') + '</div>';
    }

    function cardHtml(e) {
      const ratingHtml = e.rating
        ? '<span class="rating-pill">&#9733; ' + e.rating + '/10</span>' : '';
      const meta = [];
      if (e.year) meta.push('<span>' + esc(e.year) + '</span>');
      if (e.genre) meta.push('<span class="dot">' + esc(e.genre) + '</span>');
      if (e.status === 'watched' && e.watch_date)
        meta.push('<span class="dot">Watched ' + esc(fmtDate(e.watch_date)) + '</span>');
      const typeBadge = e.type ? '<span class="badge badge-type">' + TYPE_LABELS[e.type] + '</span>' : '';

      return '' +
        '<div class="card s-' + e.status + '">' +
          '<div class="card-top">' +
            '<div class="card-title">' + esc(e.title) + '</div>' +
            ratingHtml +
          '</div>' +
          '<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;">' +
            '<span class="badge badge-' + e.status + '">' + (STATUS_LABELS[e.status] || e.status) + '</span>' +
            typeBadge +
          '</div>' +
          (meta.length ? '<div class="card-meta">' + meta.join('') + '</div>' : '') +
          (e.notes ? '<div class="card-notes">' + esc(e.notes) + '</div>' : '') +
          '<div class="card-actions">' +
            '<button class="icon-btn" onclick="openEditModal(\'' + e.id + '\')">Edit</button>' +
            '<button class="icon-btn del" onclick="confirmDelete(\'' + e.id + '\')">Delete</button>' +
          '</div>' +
        '</div>';
    }

    // ---------- Filter / sort / view ----------
    function setFilter(status) {
      currentFilter = status;
      localStorage.setItem(LS_FILTER, status);
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('active', t.dataset.status === status));
      render();
    }
    function setSort(val) {
      currentSort = val;
      localStorage.setItem(LS_SORT, val);
      render();
    }
    function switchView(v) {
      currentView = v;
      document.getElementById('view-list').classList.toggle('hidden', v !== 'list');
      document.getElementById('view-stats').classList.toggle('hidden', v !== 'stats');
      document.getElementById('nav-list').classList.toggle('active', v === 'list');
      document.getElementById('nav-stats').classList.toggle('active', v === 'stats');
      if (v === 'stats') renderStats();
    }

    // ---------- Modal (add/edit) ----------
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Entry';
      document.getElementById('save-btn').textContent = 'Save Entry';
      document.getElementById('f-id').value = '';
      document.getElementById('entry-form').reset();
      document.getElementById('f-type').value = 'movie';
      document.getElementById('f-status').value = 'want_to_watch';
      hideFormError();
      onStatusChange();
      document.getElementById('modal').classList.add('open');
      setTimeout(() => document.getElementById('f-title').focus(), 60);
    }
    function openEditModal(id) {
      const e = entries.find(x => x.id === id);
      if (!e) return;
      document.getElementById('modal-title').textContent = 'Edit Entry';
      document.getElementById('save-btn').textContent = 'Save Changes';
      document.getElementById('f-id').value = e.id;
      document.getElementById('f-title').value = e.title || '';
      document.getElementById('f-type').value = e.type || 'movie';
      document.getElementById('f-status').value = e.status || 'want_to_watch';
      document.getElementById('f-year').value = e.year || '';
      document.getElementById('f-genre').value = e.genre || '';
      document.getElementById('f-watchdate').value = e.watch_date || '';
      document.getElementById('f-rating').value = e.rating || '';
      document.getElementById('f-notes').value = e.notes || '';
      hideFormError();
      onStatusChange();
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    // Watch date + rating are most relevant once something is watched.
    function onStatusChange() {
      const watched = document.getElementById('f-status').value === 'watched';
      document.getElementById('wrap-watchdate').style.opacity = watched ? '1' : '0.55';
      if (watched && !document.getElementById('f-watchdate').value) {
        document.getElementById('f-watchdate').value = new Date().toISOString().slice(0, 10);
      }
    }

    function showFormError(msg) {
      const el = document.getElementById('form-error');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideFormError() { document.getElementById('form-error').classList.remove('show'); }

    async function saveEntry() {
      const id = document.getElementById('f-id').value;
      const title = document.getElementById('f-title').value.trim();
      if (!title) { showFormError('Title is required.'); return; }

      const ratingRaw = document.getElementById('f-rating').value;
      const rating = ratingRaw === '' ? null : parseInt(ratingRaw, 10);
      if (rating !== null && (rating < 1 || rating > 10)) {
        showFormError('Rating must be between 1 and 10.'); return;
      }

      const body = {
        title,
        type: document.getElementById('f-type').value,
        status: document.getElementById('f-status').value,
        year: document.getElementById('f-year').value || null,
        genre: document.getElementById('f-genre').value.trim() || null,
        watch_date: document.getElementById('f-watchdate').value || null,
        rating: rating,
        notes: document.getElementById('f-notes').value.trim() || null,
      };

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Saving&hellip;';
      try {
        if (id) {
          const updated = await apiUpdate(id, body);
          const idx = entries.findIndex(x => x.id === id);
          if (idx > -1) entries[idx] = updated;
          toast('Entry updated');
        } else {
          const created = await apiCreate(body);
          entries.unshift(created);
          toast('Entry added');
        }
        closeModal();
        render();
        if (currentView === 'stats') renderStats();
      } catch (e) {
        showFormError(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function confirmDelete(id) {
      const e = entries.find(x => x.id === id);
      if (!e) return;
      if (!confirm('Delete "' + e.title + '"? This cannot be undone.')) return;
      try {
        await apiDelete(id);
        entries = entries.filter(x => x.id !== id);
        render();
        if (currentView === 'stats') renderStats();
        toast('Entry deleted');
      } catch (err) {
        toast(err.message, true);
      }
    }

    // ---------- Stats ----------
    function renderStats() {
      const area = document.getElementById('stats-area');
      const watched = entries.filter(e => e.status === 'watched');

      if (entries.length === 0) {
        area.innerHTML = '<div class="empty"><div class="big">&#128202;</div><h3>No stats yet</h3><p>Add and watch some titles to see insights.</p></div>';
        return;
      }

      const totalWatched = watched.length;
      const moviesWatched = watched.filter(e => e.type === 'movie').length;
      const showsWatched = watched.filter(e => e.type === 'tv_show').length;
      const wantCount = entries.filter(e => e.status === 'want_to_watch').length;
      const watchingCount = entries.filter(e => e.status === 'currently_watching').length;

      const rated = watched.filter(e => e.rating != null);
      const avgRating = rated.length
        ? (rated.reduce((s, e) => s + e.rating, 0) / rated.length).toFixed(1) : '&ndash;';

      // Genre breakdown (watched only).
      const genreMap = {};
      watched.forEach(e => {
        if (e.genre) {
          const g = e.genre.trim();
          genreMap[g] = (genreMap[g] || 0) + 1;
        }
      });
      const genres = Object.entries(genreMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const maxGenre = genres.length ? genres[0][1] : 1;

      // Watch count by year (from watch_date).
      const yearMap = {};
      watched.forEach(e => {
        if (e.watch_date) {
          const y = e.watch_date.slice(0, 4);
          yearMap[y] = (yearMap[y] || 0) + 1;
        }
      });
      const years = Object.entries(yearMap).sort((a, b) => b[0].localeCompare(a[0]));
      const maxYear = years.length ? Math.max(...years.map(y => y[1])) : 1;

      // Watch count by month for the most recent year with data.
      let monthHtml = '';
      if (years.length) {
        const topYear = years[0][0];
        const monthMap = {};
        watched.forEach(e => {
          if (e.watch_date && e.watch_date.slice(0, 4) === topYear) {
            const m = e.watch_date.slice(5, 7);
            monthMap[m] = (monthMap[m] || 0) + 1;
          }
        });
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const maxM = Math.max(1, ...Object.values(monthMap));
        const rows = monthNames.map((nm, i) => {
          const key = String(i + 1).padStart(2, '0');
          const v = monthMap[key] || 0;
          return barRow(nm, v, maxM, v + '');
        }).join('');
        monthHtml =
          '<div class="panel"><h3>Watched per Month &middot; ' + topYear + '</h3>' + rows + '</div>';
      }

      let html = '';

      // Stat cards
      html += '<div class="stats-grid">' +
        statCard(totalWatched, 'Total Watched', true) +
        statCard(avgRating, 'Avg Rating') +
        statCard(wantCount, 'Want to Watch') +
        statCard(watchingCount, 'Currently Watching') +
        '</div>';

      // Movie vs show split
      html += '<div class="panel"><h3>Movies vs. TV Shows (watched)</h3><div class="split-row">' +
        '<div class="split-item"><div class="n" style="color:var(--want)">' + moviesWatched + '</div><div class="l">Movies</div></div>' +
        '<div class="split-item"><div class="n" style="color:var(--watching)">' + showsWatched + '</div><div class="l">TV Shows</div></div>' +
        '</div></div>';

      // Genre breakdown
      if (genres.length) {
        html += '<div class="panel"><h3>Top Genres (watched)</h3>' +
          genres.map(([g, n]) => barRow(g, n, maxGenre, n + (n === 1 ? ' title' : ' titles'))).join('') +
          '</div>';
      }

      // Per-year summary
      if (years.length) {
        html += '<div class="panel"><h3>Watched per Year</h3>' +
          years.map(([y, n]) => barRow(y, n, maxYear, n + '')).join('') +
          '</div>';
      }

      html += monthHtml;

      area.innerHTML = html;
    }

    function statCard(num, label, accent) {
      return '<div class="stat-card"><div class="num' + (accent ? ' accent' : '') + '">' + num + '</div><div class="lbl">' + label + '</div></div>';
    }
    function barRow(name, value, max, valLabel) {
      const pct = max > 0 ? Math.round((value / max) * 100) : 0;
      return '<div class="bar-row"><div class="bar-label"><span class="name">' + esc(name) + '</span><span class="val">' + esc(valLabel) + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
    }

    // ---------- Init ----------
    document.getElementById('sort').value = currentSort;
    setFilter(currentFilter);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    load();
  </script>
</body>
</html>
